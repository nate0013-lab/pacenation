# Publishes the web version of PaceNation to GitHub Pages
# (https://nate0013-lab.github.io/pacenation/) so it can be opened in Safari
# or Chrome on any phone. Run it from the Actions tab or push to web-app.
# GitHub Pages must be set to deploy from the gh-pages branch (Settings > Pages).
name: Web app

on:
  workflow_dispatch:
  push:
    branches: [web-app]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export the web app
        env:
          EXPO_BASE_URL: /pacenation
          EXPO_OFFLINE: '1'
        run: |
          npx expo export -p web --output-dir dist
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: Publish to the gh-pages branch
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Web app from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
