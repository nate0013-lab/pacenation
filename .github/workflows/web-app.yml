# Publishes the web version of PaceNation to GitHub Pages
# (https://nate0013-lab.github.io/pacenation/) so it can be opened in Safari
# or Chrome on any phone. Run it from the Actions tab or push to web-app.
name: Web app

on:
  workflow_dispatch:
  push:
    branches: [web-app]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export the web app
        env:
          EXPO_BASE_URL: /pacenation
          EXPO_OFFLINE: '1'
        run: |
          npx expo export -p web --output-dir dist
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
